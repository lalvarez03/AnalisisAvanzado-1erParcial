<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machete</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/machete.css" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
  <!-- El machete de cada materia es un fragmento HTML (materias/<id>/machete.html) con secciones
       <section class="fase" id="f1" data-practica="P1"> ... </section>. Este shell lo carga según ?m=<id>,
       arma el índice de fases y tipografía la matemática. Ver js/core/machete.js. -->
  <header class="machete-top">
    <div class="machete-brand">
      <span class="brand-logo" style="font-size: 20px;" id="m-logo">📄</span>
      <div>
        <h1 id="m-title">Machete</h1>
        <small id="m-sub">Resumen por fases · definiciones + resultados clave</small>
      </div>
    </div>
    <nav class="m-toc" id="m-toc" aria-label="Fases del machete"></nav>
    <a class="back-link" id="m-back" href="index.html#materias">← Materias</a>
    <button class="btn print-btn" style="margin-left:auto;" onclick="window.print()">🖨 Imprimir</button>
  </header>

  <main class="machete-wrap" id="m-root">
    <p class="m-load">Cargando machete…</p>
  </main>

  <script type="module" src="js/core/machete.js"></script>
</body>
</html>
