<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estudio — Materias</title>
  <link rel="stylesheet" href="css/styles.css" />

  <!-- MathJax para renderizar LaTeX -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
      svg: { fontCache: 'global' },
      startup: {
        ready: () => {
          MathJax.startup.defaultReady();
          window.__mathjaxReady = true;
        }
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" class="menu-toggle" aria-label="Abrir menú">☰</button>
    <a class="brand" href="#materias" title="Ir al menú de materias">
      <span class="brand-logo" id="brand-logo">🎓</span>
      <div class="brand-text">
        <strong id="brand-title">Estudio</strong>
        <small id="brand-sub">Menú de materias</small>
      </div>
    </a>
    <div class="pomodoro-widget" id="pomodoro-widget">
      <span class="pomo-mode" id="pomo-mode" title="Modo actual">🍅</span>
      <span class="pomodoro-display" id="pomo-display" title="Clic (en pausa) para editar el tiempo actual">25:00</span>
      <button id="pomo-start-btn" class="pomo-btn" title="Iniciar / Pausar">▶</button>
      <button id="pomo-reset-btn" class="pomo-btn" title="Reiniciar temporizador">↺</button>
      <button id="pomo-skip-btn" class="pomo-btn" title="Pasar a la siguiente fase">⏭</button>

      <span class="pomodoro-divider">|</span>

      <!-- Contador de Pomodoros cumplidos: se puede subir y bajar -->
      <button id="pomo-count-dec-btn" class="pomo-btn pomo-step" title="Restar un pomodoro" aria-label="Restar un pomodoro">−</button>
      <span class="pomodoro-count" id="pomo-count-display" title="Pomodoros completados">0 🍅</span>
      <button id="pomo-count-inc-btn" class="pomo-btn pomo-step" title="Sumar un pomodoro" aria-label="Sumar un pomodoro">＋</button>
      <button id="pomo-count-reset-btn" class="pomo-btn" title="Poner el contador en 0">🗑️</button>

      <span class="pomodoro-divider">|</span>
      <button id="pomo-settings-btn" class="pomo-btn" title="Configurar tiempos" aria-haspopup="dialog" aria-expanded="false">⚙️</button>
    </div>
    <a class="machete-btn" id="machete-link" href="machete.html" target="_blank" rel="noopener" title="Abrir machete en otra pestaña">
      <span class="machete-ic">📄</span><span class="machete-label">Machete</span>
    </a>
    <div class="progress-badge" id="progress-badge" title="Progreso de lectura">0%</div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <!-- El menú se genera desde js/curriculum.js (ver navigation.js) -->
      <nav class="nav" id="nav"></nav>
      <footer class="sidebar-foot">
        <small>Basado en las notas y prácticas de la materia.</small>
      </footer>
    </aside>

    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="content" id="content">
      <!-- Las páginas se renderizan aquí -->
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
